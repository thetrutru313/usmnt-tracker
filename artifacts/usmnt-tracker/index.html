<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USMNT Tracker</title>

    <!--
      Content-Security-Policy
      ═══════════════════════
      This meta tag is the primary CSP for the HTML document. Replit's static
      handler serves index.html — not Express — so the helmet CSP on the API
      server does not reach this file. This tag supplements the API server's
      response headers (which tightly lock down /api/* JSON responses).

      WHY each directive is present:

      default-src 'self'
        Catch-all baseline: anything not covered by a more specific directive
        must come from the same origin.

      script-src 'self'
        The Vite production build emits only external hashed JS bundles
        (/assets/index-*.js, /registerSW.js). No inline <script> blocks exist
        in the built HTML — confirmed from the production output. 'self' is
        sufficient; 'unsafe-inline' and 'unsafe-eval' are intentionally absent.

      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com
        'self'                — the bundled /assets/index-*.css file.
        https://fonts.googleapis.com — index.css contains
          @import url('https://fonts.googleapis.com/css2?family=Outfit...')
          which the browser fetches as a stylesheet at runtime. Omitting this
          origin breaks the Outfit and JetBrains Mono fonts site-wide.
        'unsafe-inline'       — REQUIRED by React's style={{ }} prop pattern.
          React renders style props as HTML style="" attributes (e.g. the
          TanStack virtualizer sets style="transform: translateY(Npx)").
          CSP treats these as inline styles; without 'unsafe-inline' they are
          blocked. Eliminating all inline styles would require replacing every
          dynamic style prop with CSS custom properties or CSS modules — a
          significant refactor with no functional benefit for this app.
          NOTE: 'unsafe-inline' applies only to styles, not scripts. The
          script-src directive remains 'self' with no inline allowance.

      font-src 'self' https://fonts.gstatic.com
        Google's CSS stylesheet (above) @imports the actual font binary files
        from fonts.gstatic.com. Both origins are required: googleapis.com for
        the CSS descriptor, gstatic.com for the woff2 files.

      img-src 'self' data: https://media.api-sports.io https://assets.goal.com
        'self'                     — local badge PNGs (/badges/*, /icons/*).
        data:                      — SVG data URIs used by some UI components
                                     (Lucide icon toolkit).
        https://media.api-sports.io — API-Football's CDN: all 73 team and
                                     player photo URLs stored in the database
                                     point here. Blocking it removes every
                                     club badge and player photo from the UI.
        https://assets.goal.com    — Goal.com's CDN: one player photo currently
                                     in the database uses this origin.

      connect-src 'self' https://storage.googleapis.com/replit-objstore-7761b4b7-4dc3-42da-a4a4-8ade75ae1d75/
        Most API calls go to /api/* on the same origin (same-origin in
        production; proxied through Vite in dev).

        EXCEPTION — admin invoice upload (added 2026-07-16, CSP updated 2026-08-07):
        The transparency admin form uploads invoice files via a two-step flow:
          1. POST /api/admin/transparency/upload-url  →  server issues a
             short-lived (15 min) GCS presigned PUT URL scoped to a single
             UUID object path inside the private bucket.
          2. Browser PUT to that presigned URL  →  goes directly to GCS,
             bypassing the API server entirely.
        The presigned URL always starts with
          https://storage.googleapis.com/replit-objstore-7761b4b7-4dc3-42da-a4a4-8ade75ae1d75/
        so the source expression above is scoped to this bucket only. It does
        NOT permit fetches to any other GCS bucket or Google property.

        WHY direct-to-GCS rather than proxying through /api/:
        Proxying large binary files through the API server is straightforward
        to implement but was out of scope when uploads were first added. If a
        proxy route is ever added (artifacts/api-server/src/routes/transparency.ts),
        this connect-src exception becomes removable — the PUT would become a
        same-origin /api/* call and 'self' would cover it.

        PATH-SCOPING NOTE — CSP treats the path prefix as a literal match
        against the URL path, ignoring query strings (per CSP Level 3 §6.1.5).
        GCS presigned PUT URLs carry auth as query params (?X-Goog-Signature=…)
        and do NOT redirect, so path matching is not stripped in transit.
        The scoped form was verified to be accepted by the browser; if a future
        GCS infrastructure change introduced a redirect that dropped the path,
        the fallback would be https://storage.googleapis.com (whole origin).

      frame-src 'none'
        The app never embeds iframes. Prevents accidental embedding.

      object-src 'none'
        Disables Flash, Java applets, and other plugin content entirely.

      base-uri 'self'
        Prevents injected <base> tags from redirecting relative URLs to an
        attacker-controlled origin.

      form-action 'self'
        The app has no HTML forms; this prevents any injected form from
        exfiltrating data to an external origin.

      upgrade-insecure-requests
        Instructs the browser to silently upgrade any http:// sub-resource
        references to https:// before fetching. Belt-and-suspenders alongside
        HSTS on the API server.

      WHAT IS NOT HERE:
        frame-ancestors — ignored by browsers inside a <meta> CSP tag (spec
          §7.2). X-Frame-Options: DENY on the static file server provides this
          protection. The API server's helmet config sets both
          X-Frame-Options: DENY and frame-ancestors 'none' on /api/* responses.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://media.api-sports.io https://assets.goal.com;
        connect-src 'self' https://storage.googleapis.com/replit-objstore-7761b4b7-4dc3-42da-a4a4-8ade75ae1d75/;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
      "
    />

    <!-- PWA theme -->
    <meta name="theme-color" content="#002966" />
    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="USMNT" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
