openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Player operations
  - name: fixtures
    description: Fixture operations
  - name: news
    description: News operations
  - name: injuries
    description: Injury operations
  - name: transfers
    description: Transfer operations
  - name: dashboard
    description: Dashboard operations
  - name: rankings
    description: Ranking operations
  - name: search
    description: Search operations
  - name: schedule
    description: USMNT schedule operations
  - name: transparency
    description: Transparency and donations operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List players
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PlayerCategory"
        - name: position
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerSummary"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get a player's full profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: season
          in: query
          required: false
          description: Season year (e.g. "2025") to show club-season stats for. Defaults to the most recent season with synced data.
          schema:
            type: string
        - name: cycle
          in: query
          required: false
          description: World Cup cycle label (e.g. "2026 World Cup") to show USMNT stats for. Defaults to the most recent cycle with synced data.
          schema:
            type: string
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fixtures:
    get:
      operationId: listFixtures
      tags: [fixtures]
      summary: List fixtures
      parameters:
        - name: scope
          in: query
          required: false
          description: "Filter to today's or upcoming fixtures"
          schema:
            type: string
            enum: [today, upcoming, all]
        - name: playerId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of fixtures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fixture"

  /fixtures/{id}:
    get:
      operationId: getFixture
      tags: [fixtures]
      summary: Get a fixture with tracked-player stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fixture detail with tracked players
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixtureDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List news articles
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: playerId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: List of news articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsArticle"

  /injuries:
    get:
      operationId: listInjuries
      tags: [injuries]
      summary: List injuries
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InjuryStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: List of injuries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Injury"

  /transfers:
    get:
      operationId: listTransfers
      tags: [transfers]
      summary: List transfers and rumors
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransferStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: List of transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transfer"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /rankings:
    get:
      operationId: getRankings
      tags: [rankings]
      summary: Get smart rankings
      responses:
        "200":
          description: Ranking lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rankings"

  /schedule:
    get:
      operationId: listScheduleEvents
      tags: [schedule]
      summary: List USMNT schedule events
      responses:
        "200":
          description: List of schedule events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEventsResult"

  /transparency:
    get:
      operationId: listTransparencyMonths
      tags: [transparency]
      summary: List all monthly transparency records
      responses:
        "200":
          description: Monthly transparency records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransparencyMonthsResult"

  /transparency/totals:
    get:
      operationId: getTransparencyTotals
      tags: [transparency]
      summary: Get all-time aggregate donation and expense totals
      responses:
        "200":
          description: Aggregate totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransparencyTotals"

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Global search across players and clubs
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    PlayerCategory:
      type: string
      enum: [current, fringe, prospect]

    PlayerPoolTier:
      type: string
      description: >
        Player pool classification used for fixture filtering. "core" = named
        to the 2026 World Cup roster. "inMix" = 5+ national team caps but not
        on the World Cup roster. "prospect" = everyone else under 25.
      enum: [core, inMix, prospect]

    InjuryStatus:
      type: string
      enum: [active, recovering, returned]

    TransferStatus:
      type: string
      enum: [confirmed, rumor]

    PlayerSummary:
      type: object
      required:
        - id
        - name
        - slug
        - position
        - category
        - poolTier
        - clubName
        - league
        - clubLogoUrl
        - photoUrl
        - age
        - nationalTeamCaps
        - nationalTeamGoals
        - trending
        - performanceTrend
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        position: { type: string }
        category:
          $ref: "#/components/schemas/PlayerCategory"
        poolTier:
          $ref: "#/components/schemas/PlayerPoolTier"
        clubName: { type: string }
        league: { type: string }
        clubLogoUrl: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        age: { type: integer }
        marketValueUsd: { type: ["number", "null"] }
        nationalTeamCaps: { type: integer }
        nationalTeamGoals: { type: integer }
        trending: { type: boolean }
        performanceTrend:
          type: string
          enum: [on_fire, rising, steady, falling, ice_cold]
        potentialCallUpScore: { type: ["integer", "null"] }

    PlayerStats:
      type: object
      required:
        - season
        - minutes
        - starts
        - goals
        - assists
        - shots
        - keyPasses
        - passCompletionPct
        - tackles
        - interceptions
        - duelsWonPct
        - cleanSheets
        - savePct
        - avgRating
      properties:
        season: { type: string }
        minutes: { type: integer }
        starts: { type: integer }
        goals: { type: integer }
        assists: { type: integer }
        shots: { type: integer }
        keyPasses: { type: integer }
        # Nullable: API-Football has no pass-accuracy data for some players/periods.
        passCompletionPct: { type: ["number", "null"] }
        tackles: { type: integer }
        interceptions: { type: integer }
        # Nullable: API-Football has no duels data for some players/periods.
        duelsWonPct: { type: ["number", "null"] }
        # Nullable: only derivable from real per-match data (the "last5"
        # period, backed by synced match logs) — not reported by the
        # season-summary endpoint used for season/previous_season.
        cleanSheets: { type: ["integer", "null"] }
        savePct: { type: ["number", "null"] }
        # Nullable: no rating available when the player has no rated appearances this period.
        avgRating: { type: ["number", "null"] }

    MatchLog:
      type: object
      required: [id, date, opponent, competition, result, minutes, goals, assists, rating, isNationalTeam]
      properties:
        id: { type: integer }
        # Internal fixture id — present when a fixtures row exists for this match log
        # (i.e. the fixture was synced via the club/USMNT fixture pipeline). Use this
        # to deep-link to /matches/:fixtureId. Null for old or unlinked match log entries.
        fixtureId: { type: ["integer", "null"] }
        date: { type: string, format: date }
        opponent: { type: string }
        competition: { type: string }
        result: { type: string }
        minutes: { type: integer }
        goals: { type: integer }
        assists: { type: integer }
        # Nullable: API-Football sometimes has no rating for a very brief cameo.
        rating: { type: ["number", "null"] }
        # True for a USMNT national-team appearance, false for a club match —
        # used to pick which crest (club logo vs. USMNT crest) a row renders with.
        isNationalTeam: { type: boolean }

    PlayerInjurySummary:
      type: object
      required: [id, bodyPart, status, expectedReturn, daysMissed, matchesMissed, latestUpdate, startDate]
      properties:
        id: { type: integer }
        bodyPart: { type: string }
        status:
          $ref: "#/components/schemas/InjuryStatus"
        expectedReturn: { type: ["string", "null"], format: date }
        daysMissed: { type: integer }
        matchesMissed: { type: integer }
        latestUpdate: { type: string }
        startDate: { type: string, format: date }

    PlayerTransferSummary:
      type: object
      required: [id, fromClub, toClub, transferType, status, announcedAt, summary]
      properties:
        id: { type: integer }
        fromClub: { type: string }
        toClub: { type: string }
        transferType:
          type: string
          enum: [transfer, loan, contract_extension]
        fee: { type: ["string", "null"] }
        status:
          $ref: "#/components/schemas/TransferStatus"
        probabilityScore: { type: ["integer", "null"] }
        announcedAt: { type: string, format: date-time }
        summary: { type: string }

    PlayerProfile:
      type: object
      required:
        - id
        - name
        - slug
        - position
        - category
        - poolTier
        - clubName
        - league
        - clubCountry
        - clubLogoUrl
        - photoUrl
        - age
        - contractUntil
        - marketValueUsd
        - nationalTeamCaps
        - nationalTeamGoals
        - youthNationalTeam
        - debutDate
        - potentialCallUpScore
        - performanceTrend
        - trending
        - bio
        - seasonStats
        - last5Stats
        - previousSeasonStats
        - previous5Stats
        - clubSeasonStats
        - availableClubSeasons
        - nationalTeamStats
        - availableCycles
        - matchLog
        - injuries
        - transfers
        - upcomingFixtures
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        position: { type: string }
        category:
          $ref: "#/components/schemas/PlayerCategory"
        poolTier:
          $ref: "#/components/schemas/PlayerPoolTier"
        clubName: { type: string }
        league: { type: string }
        clubCountry: { type: string }
        clubLogoUrl: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        age: { type: integer }
        contractUntil: { type: ["string", "null"], format: date }
        marketValueUsd: { type: ["number", "null"] }
        nationalTeamCaps: { type: integer }
        nationalTeamGoals: { type: integer }
        youthNationalTeam: { type: ["string", "null"] }
        debutDate: { type: ["string", "null"], format: date }
        potentialCallUpScore: { type: ["integer", "null"] }
        performanceTrend:
          type: string
          enum: [on_fire, rising, steady, falling, ice_cold]
        trending: { type: boolean }
        bio: { type: string }
        seasonStats:
          $ref: "#/components/schemas/PlayerStats"
        last5Stats:
          $ref: "#/components/schemas/PlayerStats"
        previousSeasonStats:
          $ref: "#/components/schemas/PlayerStats"
        # Stats for the 5 club matches prior to the current last-5 window,
        # used to show a prior-5 trend row on the player profile. Null when
        # there is insufficient history.
        previous5Stats:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlayerStats"
        # Club-season stats for the selected `season` query param, or the
        # most recent season with data if none was given. Distinct from
        # `seasonStats`/`previousSeasonStats` (which always reflect the
        # latest two seasons) — this backs the season-year selector.
        clubSeasonStats:
          $ref: "#/components/schemas/PlayerStats"
        # Every season year this player has club stats for, most recent
        # first (e.g. ["2026", "2025", "2024"]) — populates the selector.
        availableClubSeasons:
          type: array
          items: { type: string }
        # USMNT national-team stats aggregated from this player's synced
        # national-team match logs (current cycle). Zero/null fields when
        # the player has no USMNT appearances synced this cycle.
        nationalTeamStats:
          $ref: "#/components/schemas/PlayerStats"
        # Every World Cup cycle this player has USMNT stats for, most recent
        # first (e.g. ["2026 World Cup", "2022 World Cup"]) — populates the
        # USMNT-cycle selector, mirroring `availableClubSeasons`.
        availableCycles:
          type: array
          items: { type: string }
        matchLog:
          type: array
          items:
            $ref: "#/components/schemas/MatchLog"
        injuries:
          type: array
          items:
            $ref: "#/components/schemas/PlayerInjurySummary"
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/PlayerTransferSummary"
        upcomingFixtures:
          type: array
          items:
            $ref: "#/components/schemas/Fixture"
        recentNews:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"

    FeaturedPlayer:
      type: object
      required: [id, name, slug, position, photoUrl]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        position: { type: string }
        photoUrl: { type: ["string", "null"] }

    FixtureFeaturedPlayer:
      allOf:
        - $ref: "#/components/schemas/FeaturedPlayer"
        - type: object
          required: [poolTier]
          properties:
            poolTier:
              $ref: "#/components/schemas/PlayerPoolTier"

    Fixture:
      type: object
      required:
        - id
        - isNationalTeam
        - competition
        - kickoff
        - venue
        - homeTeam
        - awayTeam
        - homeLogoUrl
        - awayLogoUrl
        - homeScore
        - awayScore
        - status
        - tvNetwork
        - streamingService
        - featuredPlayers
      properties:
        id: { type: integer }
        isNationalTeam: { type: boolean }
        competition: { type: string }
        kickoff: { type: string, format: date-time }
        venue: { type: string }
        # City/state display string, e.g. "Orlando, FL". Null for club fixtures
        # and for NT fixtures where the venue city is not yet announced.
        city: { type: ["string", "null"] }
        homeTeam: { type: string }
        awayTeam: { type: string }
        homeLogoUrl: { type: ["string", "null"] }
        awayLogoUrl: { type: ["string", "null"] }
        homeScore: { type: ["integer", "null"] }
        awayScore: { type: ["integer", "null"] }
        status:
          type: string
          enum: [scheduled, live, finished, postponed]
        tvNetwork: { type: ["string", "null"] }
        streamingService: { type: ["string", "null"] }
        broadcastLink: { type: ["string", "null"] }
        # Elapsed match minute when status is "live"; null otherwise.
        elapsedMinute: { type: ["integer", "null"] }
        featuredPlayers:
          type: array
          items:
            $ref: "#/components/schemas/FixtureFeaturedPlayer"

    # Per-match stats for a tracked player on the fixture detail page.
    # Conceded is only set for goalkeepers (or outfielders with data); null otherwise.
    FixtureMatchLog:
      type: object
      required: [minutes, goals, assists, rating]
      properties:
        minutes: { type: integer }
        goals: { type: integer }
        assists: { type: integer }
        rating: { type: ["number", "null"] }
        conceded: { type: ["integer", "null"] }

    # A tracked USMNT player entry on the fixture detail page. matchLog is null
    # when the player is linked to the fixture but stats haven't synced yet.
    FixtureTrackedPlayer:
      type: object
      required: [id, name, slug, position, clubName, clubLogoUrl, photoUrl, poolTier, matchLog]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        position: { type: string }
        clubName: { type: string }
        clubLogoUrl: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        poolTier:
          $ref: "#/components/schemas/PlayerPoolTier"
        matchLog:
          oneOf:
            - $ref: "#/components/schemas/FixtureMatchLog"
            - type: "null"

    # Full fixture detail: fixture header + all tracked USMNT players.
    FixtureDetail:
      allOf:
        - $ref: "#/components/schemas/Fixture"
        - type: object
          required: [trackedPlayers]
          properties:
            trackedPlayers:
              type: array
              items:
                $ref: "#/components/schemas/FixtureTrackedPlayer"

    NewsArticle:
      type: object
      required:
        - id
        - headline
        - source
        - publishedAt
        - category
        - url
        - summary
        - whyItMatters
        - impactScore
        - sentiment
        - players
      properties:
        id: { type: integer }
        headline: { type: string }
        source: { type: string }
        publishedAt: { type: string, format: date-time }
        category: { type: string }
        url: { type: string }
        summary: { type: string }
        whyItMatters: { type: string }
        impactScore: { type: integer }
        sentiment:
          type: string
          enum: [positive, neutral, negative]
        players:
          type: array
          items:
            $ref: "#/components/schemas/FeaturedPlayer"

    Injury:
      type: object
      required:
        - id
        - player
        - bodyPart
        - status
        - expectedReturn
        - daysMissed
        - matchesMissed
        - latestUpdate
        - startDate
        - performanceTrend
      properties:
        id: { type: integer }
        player:
          $ref: "#/components/schemas/FeaturedPlayer"
        clubName: { type: string }
        bodyPart: { type: string }
        status:
          $ref: "#/components/schemas/InjuryStatus"
        expectedReturn: { type: ["string", "null"], format: date }
        daysMissed: { type: integer }
        matchesMissed: { type: integer }
        latestUpdate: { type: string }
        startDate: { type: string, format: date }
        performanceTrend:
          type: string
          enum: [on_fire, rising, steady, falling, ice_cold]

    Transfer:
      type: object
      required:
        - id
        - player
        - fromClub
        - toClub
        - transferType
        - status
        - announcedAt
        - summary
        - performanceTrend
      properties:
        id: { type: integer }
        player:
          $ref: "#/components/schemas/FeaturedPlayer"
        fromClub: { type: string }
        toClub: { type: string }
        transferType:
          type: string
          enum: [transfer, loan, contract_extension]
        fee: { type: ["string", "null"] }
        status:
          $ref: "#/components/schemas/TransferStatus"
        probabilityScore: { type: ["integer", "null"] }
        announcedAt: { type: string, format: date-time }
        summary: { type: string }
        performanceTrend:
          type: string
          enum: [on_fire, rising, steady, falling, ice_cold]

    ScheduleEventKind:
      type: string
      enum: [friendly, nations-league, gold-cup, copa-america, world-cup-qualifying, world-cup]

    ScheduleEventStatus:
      type: string
      enum: [confirmed, approximate, tbd]

    ScheduleEvent:
      type: object
      required:
        - id
        - slug
        - name
        - kind
        - status
        - startDate
        - endDate
        - dateLabel
        - description
        - sortOrder
        - createdAt
        - updatedAt
        - fixtures
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        kind:
          $ref: "#/components/schemas/ScheduleEventKind"
        status:
          $ref: "#/components/schemas/ScheduleEventStatus"
        startDate: { type: ["string", "null"] }
        endDate: { type: ["string", "null"] }
        dateLabel: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        # NT fixtures whose kickoff falls within this event's date window.
        # Empty array when the event has no date window or no matching fixtures.
        fixtures:
          type: array
          items:
            $ref: "#/components/schemas/Fixture"

    ScheduleEventsResult:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEvent"

    NextScheduleEvent:
      type: object
      required:
        - id
        - slug
        - name
        - kind
        - status
        - startDate
        - endDate
        - dateLabel
        - description
        - sortOrder
        - fixtures
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        kind:
          $ref: "#/components/schemas/ScheduleEventKind"
        status:
          $ref: "#/components/schemas/ScheduleEventStatus"
        startDate: { type: ["string", "null"] }
        endDate: { type: ["string", "null"] }
        dateLabel: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        # NT fixtures whose kickoff falls within this event's date window.
        # Empty array when the event has no date window or no matching fixtures.
        fixtures:
          type: array
          items:
            $ref: "#/components/schemas/Fixture"

    DashboardSummary:
      type: object
      required:
        - todaysGames
        - upcomingGames
        - latestNews
        - injuries
        - transfers
        - topPerformers
        - trending
        - recentlyReturned
      properties:
        todaysGames:
          type: array
          items:
            $ref: "#/components/schemas/Fixture"
        upcomingGames:
          type: array
          items:
            $ref: "#/components/schemas/Fixture"
        latestNews:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        injuries:
          type: array
          items:
            $ref: "#/components/schemas/Injury"
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/Transfer"
        topPerformers:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        trending:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        recentlyReturned:
          type: array
          items:
            $ref: "#/components/schemas/Injury"
        nextScheduleEvent:
          $ref: "#/components/schemas/NextScheduleEvent"

    NationalTeamWindow:
      type: object
      required: [name, startDate, endDate, description]
      properties:
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        description: { type: string }

    Rankings:
      type: object
      required:
        - mostInForm
        - bestWeekendPerformances
        - mostMinutes
        - mostGoalContributions
        - returningFromInjury
        - risingFast
        - seasonYear
      properties:
        mostInForm:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        bestWeekendPerformances:
          type: array
          items:
            $ref: "#/components/schemas/MatchLogWithPlayer"
        mostMinutes:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        mostGoalContributions:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        returningFromInjury:
          type: array
          items:
            $ref: "#/components/schemas/Injury"
        risingFast:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        # The season year both leaderboards (mostMinutes, mostGoalContributions) cover.
        # Derived server-side via seasonYearCandidates() — never hardcoded.
        seasonYear:
          type: string

    MatchLogWithPlayer:
      type: object
      required: [id, date, opponent, competition, result, minutes, goals, assists, rating, player, performanceTrend]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        opponent: { type: string }
        competition: { type: string }
        result: { type: string }
        minutes: { type: integer }
        goals: { type: integer }
        assists: { type: integer }
        # Nullable: API-Football sometimes has no rating for a very brief cameo.
        rating: { type: ["number", "null"] }
        player:
          $ref: "#/components/schemas/FeaturedPlayer"
        performanceTrend:
          type: string
          enum: [on_fire, rising, steady, falling, ice_cold]

    SearchResults:
      type: object
      required: [players, clubs]
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        clubs:
          type: array
          items:
            $ref: "#/components/schemas/ClubResult"

    ClubResult:
      type: object
      required: [name, league, country, logoUrl, playerCount]
      properties:
        name: { type: string }
        league: { type: string }
        country: { type: string }
        logoUrl: { type: ["string", "null"] }
        playerCount: { type: integer }

    TransparencyMonth:
      type: object
      required: [id, periodYear, periodMonth, expensesCents, donationsCents, goalFoundationCents]
      properties:
        id: { type: integer }
        periodYear: { type: integer }
        periodMonth: { type: integer }
        expensesCents: { type: integer }
        donationsCents: { type: integer }
        goalFoundationCents: { type: integer }
        invoiceUrl: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TransparencyTotals:
      type: object
      required: [totalExpensesCents, totalDonationsCents, totalGoalFoundationCents, monthCount]
      properties:
        totalExpensesCents: { type: integer }
        totalDonationsCents: { type: integer }
        totalGoalFoundationCents: { type: integer }
        monthCount: { type: integer }

    TransparencyMonthsResult:
      type: object
      required: [months]
      properties:
        months:
          type: array
          items:
            $ref: "#/components/schemas/TransparencyMonth"
