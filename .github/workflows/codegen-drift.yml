name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usmnt_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/usmnt_test
      # Non-secret CI values — replace with ${{ secrets.NAME }} if you need
      # the full integration surface (transparency invoice routes, rate-limit
      # tests) to run against real credentials.
      ADMIN_PASSWORD: ci-placeholder-admin-password
      # Required by the Vite build step (prevents vite.config.ts from throwing)
      PORT: "5173"
      BASE_PATH: /

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codegen drift check
        run: bash scripts/check-codegen-drift.sh

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Push database schema
        run: pnpm --filter @workspace/db run push

      - name: Test – API server
        # NOTE: 3 test files fail on a schema-only DB because they need seeded rows.
        # They will show as failures until a seed step is approved and added.
        #   coleCampbellNoStatsGraceful.test.ts  — needs a "Cole Campbell" players row
        #   recoveryRoundTrip.test.ts            — needs ≥1 seeded player row
        #   rescoreCapOrderingIntegration.test.ts — needs a clubs row (id=1) for FK
        # See task-a-findings.md for the full analysis.
        run: pnpm --filter @workspace/api-server run test

      - name: Test – USMNT Tracker (frontend)
        run: pnpm --filter @workspace/usmnt-tracker run test
